name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build -t stm32-ci-toolchain .

      - name: Static analysis (cppcheck)
        run: |
          docker run --rm -v "$PWD":/work stm32-ci-toolchain \
            cppcheck --enable=warning,style,performance,portability \
              --error-exitcode=1 --inline-suppr -I src/app -I src/hal src

      - name: Host unit tests + coverage gate
        run: |
          docker run --rm -v "$PWD":/work stm32-ci-toolchain bash -c '
            cmake -S . -B build/host -G Ninja -DBUILD_TESTS=ON -DCOVERAGE=ON &&
            cmake --build build/host &&
            ctest --test-dir build/host --output-on-failure &&
            gcovr -r . --filter "src/app/" --fail-under-line 90 --print-summary build/host'

      - name: Cross-build firmware (arm-none-eabi-gcc)
        run: |
          docker run --rm -v "$PWD":/work stm32-ci-toolchain bash -c '
            cmake -S . -B build/fw -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
              -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build/fw'

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/fw/firmware.elf

      - name: Generate SBOM (CycloneDX 1.5)
        run: |
          docker run --rm -e SBOM_VERSION="${{ github.sha }}" \
            -v "$PWD":/work stm32-ci-toolchain \
            python3 tools/gen_sbom.py \
              --elf build/fw/firmware.elf --map build/fw/firmware.map \
              --out build/sbom/firmware.cdx.json

      - name: Validate SBOM (schema + sanity checks)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q "cyclonedx-python-lib[validation]==11.12.0"
          .venv/bin/python tools/validate_sbom.py build/sbom/firmware.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/sbom/firmware.cdx.json

  simulate:
    needs: build-test
    runs-on: ubuntu-24.04
    container:
      image: antmicro/renode:1.15.3
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build/fw
      - name: Renode boot test
        run: renode-test sim/boot.robot
      - name: Upload Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-logs
          path: |
            log.html
            report.html
            robot_output.xml
          if-no-files-found: ignore

  sbom-scan:
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - name: Scan SBOM for known vulnerabilities (Grype)
        uses: anchore/scan-action@v6
        with:
          sbom: sbom/firmware.cdx.json
          fail-build: true
          severity-cutoff: high